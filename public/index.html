<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Farger · Colors</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%23111'/%3E%3Ccircle cx='20' cy='38' r='10' fill='%23ffd23f'/%3E%3Ccircle cx='32' cy='22' r='10' fill='%2334c759'/%3E%3Ccircle cx='44' cy='38' r='10' fill='%233a86ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "Fredoka", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    --sheet: #17161f;
    --sheet-2: #211f2c;
    --line: rgba(255, 255, 255, 0.08);
    --text: #f5f3ff;
    --muted: rgba(245, 243, 255, 0.55);
    --accent: #ffd23f;
    --ease-pop: cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: var(--font);
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ---------- Stage ---------- */

  #stage {
    position: fixed;
    inset: 0;
    background: #000;
    cursor: pointer;
    transition: background-color 0.35s ease;
  }

  /* A circle that grows from where you tapped, then hands its color to the stage. */
  .splash {
    position: fixed;
    inset: 0;
    pointer-events: none;
    clip-path: circle(0 at var(--x) var(--y));
    animation: splash 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes splash {
    to { clip-path: circle(150vmax at var(--x) var(--y)); }
  }

  #name {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    font-weight: 700;
    font-size: clamp(3rem, 16vmin, 12rem);
    letter-spacing: 0.02em;
    text-align: center;
    padding: 0 1rem;
    opacity: 0;
  }
  #name.show { animation: pop 0.5s var(--ease-pop) forwards; }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.6) rotate(-4deg); }
    to   { opacity: 1; transform: scale(1) rotate(0); }
  }

  /* Pause countdown: a thin ring that drains while a color is showing. */
  #countdown {
    position: fixed;
    left: 50%;
    bottom: max(1.5rem, env(safe-area-inset-bottom));
    width: 44px;
    height: 44px;
    margin-left: -22px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #countdown.show { opacity: 0.55; }
  #countdown circle { fill: none; stroke-width: 4; stroke-linecap: round; }
  #countdown .track { stroke: currentColor; opacity: 0.25; }
  #countdown .bar {
    stroke: currentColor;
    stroke-dasharray: 113.1;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
  }
  #countdown.run .bar { animation: drain var(--dur) linear forwards; }
  @keyframes drain { to { stroke-dashoffset: 113.1; } }

  /* ---------- Start hint ---------- */

  #hint {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.75rem;
    pointer-events: none;
    transition: opacity 0.4s, transform 0.4s;
  }
  #hint.gone { opacity: 0; transform: scale(0.9); }
  #hint .dots { display: flex; gap: 0.9rem; }
  #hint .dots span {
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    animation: bounce 1.4s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-0.9rem); }
  }
  #hint p {
    margin: 0;
    font-size: clamp(1.1rem, 3.2vmin, 1.6rem);
    font-weight: 500;
    color: rgba(255, 255, 255, 0.5);
    text-align: center;
    padding: 0 2rem;
  }
  body.light #hint p { color: rgba(0, 0, 0, 0.5); }
  body.light #hint kbd { border-color: rgba(0, 0, 0, 0.3); }
  #hint kbd {
    font-family: inherit;
    padding: 0.1em 0.7em;
    border-radius: 999px;
    border: 2px solid rgba(255, 255, 255, 0.3);
  }

  /* ---------- Floating buttons ---------- */

  #controls {
    position: fixed;
    top: max(1rem, env(safe-area-inset-top));
    right: max(1rem, env(safe-area-inset-right));
    display: flex;
    gap: 0.6rem;
    transition: opacity 0.6s;
    z-index: 5;
  }
  #controls.idle { opacity: 0.2; }
  #controls.idle:hover { opacity: 1; }

  .fab {
    width: 3.25rem;
    height: 3.25rem;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.14);
    color: #fff;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: transform 0.25s var(--ease-pop), background 0.2s;
  }
  .fab:hover { background: rgba(255, 255, 255, 0.24); transform: scale(1.08); }
  .fab:active { transform: scale(0.92); }
  .fab svg { width: 1.5rem; height: 1.5rem; }
  #gear svg { transition: transform 0.6s var(--ease-pop); }
  #gear:hover svg { transform: rotate(60deg); }
  body.light .fab { background: rgba(0, 0, 0, 0.12); color: #111; }
  body.light .fab:hover { background: rgba(0, 0, 0, 0.2); }

  /* ---------- Settings sheet ---------- */

  #scrim {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: grid;
    place-items: center;
    padding: 1rem;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.25s, visibility 0.25s;
  }
  #scrim.open { opacity: 1; visibility: visible; }

  #sheet {
    width: min(100%, 30rem);
    max-height: calc(100dvh - 2rem);
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: none;
    background: linear-gradient(160deg, var(--sheet-2), var(--sheet) 60%);
    border-radius: 2.25rem;
    padding: 1.5rem 1.5rem 1.75rem;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    transform: translateY(1.5rem) scale(0.94);
    transition: transform 0.4s var(--ease-pop);
    user-select: text;
    -webkit-user-select: text;
  }
  #sheet::-webkit-scrollbar { display: none; }
  #scrim.open #sheet { transform: none; }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  .sheet-head h2 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 0.6rem;
  }
  .sheet-head h2 .blob {
    width: 1.1rem;
    height: 1.1rem;
    border-radius: 50%;
    background: conic-gradient(#ffd23f, #34c759, #3a86ff, #ff5d8f, #ffd23f);
  }

  .round {
    width: 2.5rem;
    height: 2.5rem;
    flex: none;
    border: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.08);
    transition: transform 0.2s var(--ease-pop), background 0.2s, opacity 0.2s;
  }
  .round:hover { background: rgba(255, 255, 255, 0.16); transform: scale(1.08); }
  .round:active { transform: scale(0.9); }
  .round:disabled { opacity: 0.25; pointer-events: none; }
  .round svg { width: 1.1rem; height: 1.1rem; }

  section { margin-top: 1.6rem; }
  section h3 {
    margin: 0 0 0.7rem 0.4rem;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* Color list */
  #colors { display: flex; flex-direction: column; gap: 0.55rem; }
  .color-row {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.4rem 0.4rem 0.4rem 0.45rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    animation: row-in 0.35s var(--ease-pop);
  }
  @keyframes row-in { from { opacity: 0; transform: scale(0.9); } }

  .swatch {
    position: relative;
    width: 2.6rem;
    height: 2.6rem;
    flex: none;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.12), 0 4px 14px color-mix(in srgb, var(--c) 45%, transparent);
    cursor: pointer;
    transition: transform 0.25s var(--ease-pop);
  }
  .swatch:hover { transform: scale(1.1) rotate(-6deg); }
  .swatch:active { transform: scale(0.92); }
  .swatch input {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
    border: 0;
    padding: 0;
  }
  .swatch:focus-within { box-shadow: 0 0 0 3px var(--accent); }

  .name-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    font-size: 1.15rem;
    font-weight: 500;
    padding: 0.35rem 0.2rem;
  }
  .name-input::placeholder { color: var(--muted); font-weight: 400; }

  .add {
    margin-top: 0.3rem;
    width: 100%;
    padding: 0.75rem;
    border-radius: 999px;
    border: 2px dashed rgba(255, 255, 255, 0.18);
    background: transparent;
    color: var(--muted);
    font-weight: 500;
    transition: border-color 0.2s, color 0.2s, transform 0.2s var(--ease-pop);
  }
  .add:hover { border-color: var(--accent); color: var(--text); }
  .add:active { transform: scale(0.97); }

  /* Setting rows */
  .card {
    border-radius: 1.75rem;
    background: rgba(255, 255, 255, 0.05);
    padding: 0.35rem 1.1rem;
  }
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    min-height: 3.4rem;
  }
  .row + .row { border-top: 1px solid var(--line); }
  .row label.text { flex: 1; font-size: 1.05rem; cursor: pointer; }
  .row[hidden] { display: none; }

  /* Pill toggle switch */
  .switch { position: relative; width: 3.4rem; height: 2rem; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
  .switch .track {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.14);
    transition: background 0.25s;
  }
  .switch .track::after {
    content: "";
    position: absolute;
    top: 0.2rem;
    left: 0.2rem;
    width: 1.6rem;
    height: 1.6rem;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
    transition: transform 0.35s var(--ease-pop);
  }
  .switch input:checked + .track { background: #34c759; }
  .switch input:checked + .track::after { transform: translateX(1.4rem); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 3px var(--accent); }

  /* Segmented pill */
  .segmented {
    position: relative;
    display: inline-flex;
    padding: 0.25rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
  }
  .segmented button {
    position: relative;
    z-index: 1;
    border: 0;
    background: transparent;
    padding: 0.45rem 0.95rem;
    border-radius: 999px;
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--muted);
    transition: color 0.25s;
    white-space: nowrap;
  }
  .segmented button[aria-pressed="true"] { color: #17161f; }
  .segmented .thumb {
    position: absolute;
    top: 0.25rem;
    bottom: 0.25rem;
    border-radius: 999px;
    background: var(--accent);
    transition: left 0.35s var(--ease-pop), width 0.35s var(--ease-pop);
  }

  /* Seconds stepper */
  .stepper { display: flex; align-items: center; gap: 0.5rem; }
  .stepper output {
    min-width: 3.2rem;
    text-align: center;
    font-size: 1.1rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .footer { margin-top: 1.8rem; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.6rem; }
  .pill {
    border: 0;
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    background: var(--accent);
    color: #17161f;
    font-weight: 600;
    transition: transform 0.25s var(--ease-pop), filter 0.2s;
  }
  .pill:hover { transform: scale(1.05); filter: brightness(1.08); }
  .pill:active { transform: scale(0.95); }
  .ghost {
    border: 0;
    padding: 0.7rem 1.4rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
    color: var(--muted);
    font-weight: 500;
    transition: background 0.2s, color 0.2s, transform 0.2s var(--ease-pop);
  }
  .ghost:hover { background: rgba(255, 93, 143, 0.18); color: #ff9dbb; }
  .ghost:active { transform: scale(0.95); }

  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div id="stage" aria-live="polite"></div>
<div id="name"></div>
<svg id="countdown" viewBox="0 0 44 44" aria-hidden="true">
  <circle class="track" cx="22" cy="22" r="18"/>
  <circle class="bar" cx="22" cy="22" r="18"/>
</svg>

<div id="hint">
  <div class="dots"></div>
  <p data-i18n-html="hint"></p>
</div>

<div id="controls">
  <button class="fab" id="fullscreen" data-i18n-title="fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path class="enter" d="M4 9V6a2 2 0 0 1 2-2h3M15 4h3a2 2 0 0 1 2 2v3M20 15v3a2 2 0 0 1-2 2h-3M9 20H6a2 2 0 0 1-2-2v-3"/><path class="exit" style="display:none" d="M9 4v3a2 2 0 0 1-2 2H4M20 9h-3a2 2 0 0 1-2-2V4M15 20v-3a2 2 0 0 1 2-2h3M4 15h3a2 2 0 0 1 2 2v3"/></svg>
  </button>
  <button class="fab" id="gear" data-i18n-title="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<div id="scrim">
  <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title"><span class="blob"></span><span data-i18n="settings"></span></h2>
      <button class="round" id="close" data-i18n-title="close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <section>
      <h3 data-i18n="colors"></h3>
      <div id="colors"></div>
      <button class="add" id="add" data-i18n="addColor"></button>
    </section>

    <section>
      <h3 data-i18n="play"></h3>
      <div class="card">
        <div class="row">
          <label class="text" for="no-repeat" data-i18n="noRepeat"></label>
          <span class="switch"><input type="checkbox" id="no-repeat"><span class="track"></span></span>
        </div>
        <div class="row">
          <label class="text" for="show-name" data-i18n="showName"></label>
          <span class="switch"><input type="checkbox" id="show-name"><span class="track"></span></span>
        </div>
      </div>
    </section>

    <section>
      <h3 data-i18n="between"></h3>
      <div class="card">
        <div class="row">
          <label class="text" for="pause-on" data-i18n="pauseOn"></label>
          <span class="switch"><input type="checkbox" id="pause-on"><span class="track"></span></span>
        </div>
        <div class="row" data-pause>
          <span class="text" data-i18n="pauseWhen"></span>
          <div class="segmented" id="pause-mode">
            <span class="thumb"></span>
            <button data-value="tap" data-i18n="onTap"></button>
            <button data-value="timer" data-i18n="afterTime"></button>
          </div>
        </div>
        <div class="row" data-pause data-timer>
          <span class="text" data-i18n="seconds"></span>
          <div class="stepper">
            <button class="round" id="sec-down" aria-label="−"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
            <output id="sec"></output>
            <button class="round" id="sec-up" aria-label="+"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 6v12M6 12h12"/></svg></button>
          </div>
        </div>
        <div class="row" data-pause>
          <span class="text" data-i18n="pauseColor"></span>
          <label class="swatch" id="pause-swatch"><input type="color" id="pause-color" data-i18n-title="pauseColor"></label>
        </div>
      </div>
    </section>

    <section>
      <h3 data-i18n="language"></h3>
      <div class="segmented" id="lang">
        <span class="thumb"></span>
        <button data-value="auto">Auto</button>
        <button data-value="no">Norsk</button>
        <button data-value="en">English</button>
      </div>
    </section>

    <div class="footer">
      <button class="pill" id="share" data-i18n="share"></button>
      <button class="ghost" id="reset" data-i18n="reset"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const STORAGE_KEY = "color-settings-v1";

  const I18N = {
    no: {
      hint: "Trykk <kbd>mellomrom</kbd> eller på skjermen",
      settings: "Innstillinger",
      fullscreen: "Fullskjerm",
      close: "Lukk",
      colors: "Farger",
      addColor: "+ Legg til farge",
      namePlaceholder: "Navn (valgfritt)",
      pickColor: "Velg farge",
      remove: "Fjern",
      play: "Spill",
      noRepeat: "Aldri samme farge to ganger på rad",
      showName: "Vis navnet på fargen",
      between: "Mellom fargene",
      pauseOn: "Vis pauseskjerm mellom fargene",
      pauseWhen: "Gå til pause",
      onTap: "Ved trykk",
      afterTime: "Etter tid",
      seconds: "Sekunder",
      pauseColor: "Pausefarge",
      language: "Språk",
      reset: "Tilbakestill alt",
      share: "Del oppsett",
      copied: "Lenke kopiert!",
      copyThis: "Kopier denne lenken:",
      confirmReset: "Tilbakestille alle innstillinger?",
      yellow: "Gul", green: "Grønn", blue: "Blå",
    },
    en: {
      hint: "Press <kbd>space</kbd> or tap the screen",
      settings: "Settings",
      fullscreen: "Fullscreen",
      close: "Close",
      colors: "Colors",
      addColor: "+ Add color",
      namePlaceholder: "Name (optional)",
      pickColor: "Pick color",
      remove: "Remove",
      play: "Play",
      noRepeat: "Never the same color twice in a row",
      showName: "Show the color's name",
      between: "Between colors",
      pauseOn: "Show a pause screen between colors",
      pauseWhen: "Go to pause",
      onTap: "On tap",
      afterTime: "After time",
      seconds: "Seconds",
      pauseColor: "Pause color",
      language: "Language",
      reset: "Reset everything",
      share: "Share setup",
      copied: "Link copied!",
      copyThis: "Copy this link:",
      confirmReset: "Reset all settings?",
      yellow: "Yellow", green: "Green", blue: "Blue",
    },
  };

  // Built-in colors carry an i18n `key` so their default name follows the
  // language. A custom `name` overrides it; clearing the name brings it back.
  // The letter is their short form in share links.
  const BUILTIN = {
    y: { hex: "#ffd23f", key: "yellow" },
    g: { hex: "#34c759", key: "green" },
    b: { hex: "#3a86ff", key: "blue" },
  };

  const defaults = () => ({
    lang: "auto",
    colors: Object.values(BUILTIN).map((c) => ({ ...c })),
    noRepeat: true,
    showName: true,
    pause: { enabled: false, mode: "tap", seconds: 5, hex: "#000000" },
  });

  const load = () => {
    const d = defaults();
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (!s) return d;
      return {
        ...d,
        ...s,
        colors: Array.isArray(s.colors) && s.colors.length ? s.colors : d.colors,
        pause: { ...d.pause, ...s.pause },
      };
    } catch {
      return d;
    }
  };

  // ---------- Share links ----------
  //
  // Settings are mirrored into the URL fragment so the address bar is always a
  // shareable link. Anything at its default is left out, so the defaults are
  // just the bare URL. Format: `&`-separated `key=value` pairs.
  //
  //   c=y:Hopp,g,e63946:Snurr+rundt   colors, comma-separated. A token is a
  //                                   built-in letter (y/g/b) or a 3/6-digit
  //                                   hex, plus an optional `:name`. Names are
  //                                   percent-encoded, with `+` for spaces.
  //   p=t | p=5 | p=5:fff             pause screen on: `t` = on tap, a number =
  //                                   after that many seconds; optional `:hex`
  //                                   pause color (black if left out)
  //   o=r | o=n | o=                  options, only if not both on:
  //                                   r = no repeats, n = show names
  //   l=no | l=en                     language (auto if left out)
  //
  // Unknown keys and malformed tokens are ignored, so older links keep working.

  const shortHex = (hex) => {
    const h = hex.slice(1).toLowerCase();
    return h[0] === h[1] && h[2] === h[3] && h[4] === h[5] ? h[0] + h[2] + h[4] : h;
  };
  const parseHex = (s) => {
    if (/^[0-9a-f]{3}$/i.test(s)) s = s.replace(/./g, "$&$&");
    return /^[0-9a-f]{6}$/i.test(s) ? `#${s.toLowerCase()}` : null;
  };
  const encName = (n) => encodeURIComponent(n).replace(/%20/g, "+");
  const decName = (n) => {
    try { return decodeURIComponent(n.replace(/\+/g, " ")); } catch { return ""; }
  };

  const encode = (st) => {
    const parts = [];
    const colors = st.colors.map((c) => {
      const letter = Object.keys(BUILTIN).find((k) => BUILTIN[k].key === c.key && BUILTIN[k].hex === c.hex);
      return (letter ?? shortHex(c.hex)) + (c.name ? `:${encName(c.name)}` : "");
    }).join(",");
    if (colors !== "y,g,b") parts.push(`c=${colors}`);
    const p = st.pause;
    if (p.enabled) {
      parts.push(`p=${p.mode === "timer" ? p.seconds : "t"}${p.hex !== "#000000" ? `:${shortHex(p.hex)}` : ""}`);
    }
    if (!(st.noRepeat && st.showName)) parts.push(`o=${st.noRepeat ? "r" : ""}${st.showName ? "n" : ""}`);
    if (st.lang !== "auto") parts.push(`l=${st.lang}`);
    return parts.join("&");
  };

  const decode = (hash) => {
    const st = defaults();
    for (const part of hash.split("&")) {
      const i = part.indexOf("=");
      if (i < 0) continue;
      const k = part.slice(0, i), v = part.slice(i + 1);
      if (k === "c") {
        const colors = v.split(",").map((tok) => {
          const [id, name] = tok.split(":");
          const c = BUILTIN[id] ? { ...BUILTIN[id] } : parseHex(id) && { hex: parseHex(id) };
          if (c && name) c.name = decName(name).trim();
          return c;
        }).filter(Boolean);
        if (colors.length) st.colors = colors;
      } else if (k === "p") {
        const [mode, hex] = v.split(":");
        const secs = parseInt(mode, 10);
        st.pause.enabled = true;
        st.pause.mode = mode === "t" ? "tap" : "timer";
        if (secs) st.pause.seconds = Math.min(60, Math.max(1, secs));
        if (hex && parseHex(hex)) st.pause.hex = parseHex(hex);
      } else if (k === "o") {
        st.noRepeat = v.includes("r");
        st.showName = v.includes("n");
      } else if (k === "l" && I18N[v]) {
        st.lang = v;
      }
    }
    return st;
  };

  const shareUrl = () => {
    const hash = encode(settings);
    return location.href.split("#")[0] + (hash ? `#${hash}` : "");
  };

  const fromHash = () => location.hash.length > 1 && decode(location.hash.slice(1));

  let settings = fromHash() || load();
  const save = () => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    history.replaceState(null, "", shareUrl());
  };
  save();

  // Pasting a different link into an open tab.
  addEventListener("hashchange", () => {
    settings = fromHash() || defaults();
    lastIndex = -1;
    save();
    renderAll();
    if (state !== "color") paint(pauseHex());
  });

  const $ = (sel) => document.querySelector(sel);
  const stage = $("#stage");
  const nameEl = $("#name");
  const hint = $("#hint");
  const controls = $("#controls");
  const scrim = $("#scrim");
  const countdown = $("#countdown");

  // ---------- i18n ----------

  const lang = () => {
    if (settings.lang !== "auto") return settings.lang;
    const nordic = (navigator.languages || [navigator.language]).some((l) => /^(no|nb|nn)\b/i.test(l));
    return nordic ? "no" : "en";
  };
  const t = (k) => I18N[lang()][k] ?? I18N.en[k] ?? k;
  const colorName = (c) => c.name || (c.key ? t(c.key) : "");

  const applyI18n = () => {
    document.documentElement.lang = lang();
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
    document.querySelectorAll("[data-i18n-html]").forEach((el) => (el.innerHTML = t(el.dataset.i18nHtml)));
    document.querySelectorAll("[data-i18n-title]").forEach((el) => {
      el.title = t(el.dataset.i18nTitle);
      el.setAttribute("aria-label", el.title);
    });
  };

  // ---------- Color helpers ----------

  const isLight = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    const [r, g, b] = [n >> 16, (n >> 8) & 255, n & 255].map((v) => {
      v /= 255;
      return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4;
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.35;
  };

  const hexToRgb = (hex) => {
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${n >> 16}, ${(n >> 8) & 255}, ${n & 255})`;
  };

  const randomHex = () => {
    // Bright, saturated colors read best on a big screen.
    const h = Math.floor(Math.random() * 360);
    const s = 0.75, l = 0.55;
    const f = (n) => {
      const k = (n + h / 30) % 12;
      const c = l - s * Math.min(l, 1 - l) * Math.max(-1, Math.min(k - 3, 9 - k, 1));
      return Math.round(c * 255).toString(16).padStart(2, "0");
    };
    return `#${f(0)}${f(8)}${f(4)}`;
  };

  // ---------- Stage ----------

  // "start" → the page before the first color, "color" → a color is showing,
  // "pause" → the pause screen between colors.
  let state = "start";
  let lastIndex = -1;
  let pauseTimer = null;

  const pauseHex = () => (settings.pause.enabled ? settings.pause.hex : "#000000");

  const paint = (hex, x, y) => {
    const splash = document.createElement("div");
    splash.className = "splash";
    splash.style.background = hex;
    splash.style.setProperty("--x", `${x ?? innerWidth / 2}px`);
    splash.style.setProperty("--y", `${y ?? innerHeight / 2}px`);
    stage.after(splash);
    splash.addEventListener("animationend", () => {
      stage.style.transition = "none";
      stage.style.backgroundColor = hex;
      stage.offsetWidth;
      stage.style.transition = "";
      splash.remove();
    });
    document.body.classList.toggle("light", isLight(hex));
    document.querySelector('meta[name="theme-color"]').content = hex;
  };

  const showName = (text, hex) => {
    nameEl.classList.remove("show");
    nameEl.textContent = text;
    nameEl.style.color = isLight(hex) ? "rgba(0,0,0,0.78)" : "rgba(255,255,255,0.92)";
    if (text) {
      nameEl.offsetWidth; // restart the pop animation
      nameEl.classList.add("show");
    }
  };

  const stopCountdown = () => {
    clearTimeout(pauseTimer);
    pauseTimer = null;
    countdown.classList.remove("show", "run");
  };

  const pick = () => {
    const n = settings.colors.length;
    if (n === 1) return 0;
    let i;
    do i = Math.floor(Math.random() * n);
    while (settings.noRepeat && i === lastIndex);
    return i;
  };

  const showColor = (x, y) => {
    stopCountdown();
    const i = pick();
    lastIndex = i;
    const c = settings.colors[i];
    state = "color";
    hint.classList.add("gone");
    paint(c.hex, x, y);
    showName(settings.showName ? colorName(c) : "", c.hex);

    startCountdown(c.hex);
  };

  const startCountdown = (hex) => {
    stopCountdown();
    if (!settings.pause.enabled || settings.pause.mode !== "timer") return;
    const ms = settings.pause.seconds * 1000;
    countdown.style.color = isLight(hex) ? "#000" : "#fff";
    countdown.style.setProperty("--dur", `${ms}ms`);
    countdown.offsetWidth; // restart the drain animation
    countdown.classList.add("show", "run");
    pauseTimer = setTimeout(() => showPause(), ms);
  };

  const showPause = (x, y) => {
    stopCountdown();
    state = "pause";
    paint(pauseHex(), x, y);
    showName("", pauseHex());
  };

  const advance = (x, y) => {
    if (scrim.classList.contains("open")) return;
    keepAwake();
    const tapToPause = settings.pause.enabled && settings.pause.mode === "tap";
    if (state === "color" && tapToPause) showPause(x, y);
    else showColor(x, y);
  };

  stage.addEventListener("click", (e) => advance(e.clientX, e.clientY));

  document.addEventListener("keydown", (e) => {
    if (scrim.classList.contains("open")) {
      if (e.key === "Escape") closeSettings();
      return;
    }
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      if (!e.repeat) advance();
    }
  });

  // ---------- Idle controls ----------

  let idleTimer;
  const wake = () => {
    controls.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => controls.classList.add("idle"), 3000);
  };
  ["mousemove", "pointerdown"].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));
  wake();

  // ---------- Fullscreen & wake lock ----------

  const fsBtn = $("#fullscreen");
  if (!document.documentElement.requestFullscreen) fsBtn.hidden = true;
  fsBtn.addEventListener("click", () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  });
  document.addEventListener("fullscreenchange", () => {
    const on = !!document.fullscreenElement;
    fsBtn.querySelector(".enter").style.display = on ? "none" : "";
    fsBtn.querySelector(".exit").style.display = on ? "" : "none";
  });

  let wakeLock = null;
  const keepAwake = async () => {
    if (wakeLock || !navigator.wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => (wakeLock = null));
    } catch {}
  };
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state !== "start") keepAwake();
  });

  // ---------- Settings UI ----------

  const colorsEl = $("#colors");

  const icon = {
    remove: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  };

  const renderColors = () => {
    colorsEl.innerHTML = "";
    settings.colors.forEach((c, i) => {
      const row = document.createElement("div");
      row.className = "color-row";

      const swatch = document.createElement("label");
      swatch.className = "swatch";
      swatch.style.setProperty("--c", c.hex);
      swatch.title = t("pickColor");
      const picker = document.createElement("input");
      picker.type = "color";
      picker.value = c.hex;
      picker.setAttribute("aria-label", t("pickColor"));
      picker.addEventListener("input", () => {
        c.hex = picker.value;
        // A recolored built-in is no longer "yellow"; keep only a custom name.
        delete c.key;
        swatch.style.setProperty("--c", c.hex);
        save();
        renderDots();
      });
      swatch.append(picker);

      const name = document.createElement("input");
      name.className = "name-input";
      name.value = c.name || "";
      name.placeholder = c.key ? t(c.key) : t("namePlaceholder");
      name.spellcheck = false;
      name.addEventListener("input", () => {
        c.name = name.value.trim();
        save();
      });

      const remove = document.createElement("button");
      remove.className = "round";
      remove.innerHTML = icon.remove;
      remove.title = t("remove");
      remove.setAttribute("aria-label", t("remove"));
      remove.disabled = settings.colors.length <= 1;
      remove.addEventListener("click", () => {
        settings.colors.splice(i, 1);
        lastIndex = -1;
        save();
        renderColors();
        renderDots();
      });

      row.append(swatch, name, remove);
      colorsEl.append(row);
    });
  };

  const renderDots = () => {
    const dots = hint.querySelector(".dots");
    dots.innerHTML = "";
    settings.colors.forEach((c, i) => {
      const s = document.createElement("span");
      s.style.background = c.hex;
      s.style.animationDelay = `${i * 0.15}s`;
      dots.append(s);
    });
  };

  const setSegmented = (el, value) => {
    const thumb = el.querySelector(".thumb");
    el.querySelectorAll("button").forEach((b) => {
      const on = b.dataset.value === value;
      b.setAttribute("aria-pressed", on);
      if (on) {
        thumb.style.left = `${b.offsetLeft}px`;
        thumb.style.width = `${b.offsetWidth}px`;
      }
    });
  };

  const renderOptions = () => {
    $("#no-repeat").checked = settings.noRepeat;
    $("#show-name").checked = settings.showName;
    $("#pause-on").checked = settings.pause.enabled;
    document.querySelectorAll("[data-pause]").forEach((r) => {
      r.hidden = !settings.pause.enabled || (r.hasAttribute("data-timer") && settings.pause.mode !== "timer");
    });
    $("#sec").textContent = `${settings.pause.seconds} s`;
    $("#sec-down").disabled = settings.pause.seconds <= 1;
    $("#sec-up").disabled = settings.pause.seconds >= 60;
    $("#pause-color").value = settings.pause.hex;
    $("#pause-swatch").style.setProperty("--c", settings.pause.hex);
    // Segmented thumbs measure their buttons, so they need the sheet laid out.
    requestAnimationFrame(() => {
      setSegmented($("#pause-mode"), settings.pause.mode);
      setSegmented($("#lang"), settings.lang);
    });
  };

  const renderAll = () => {
    applyI18n();
    renderColors();
    renderDots();
    renderOptions();
  };

  const openSettings = () => {
    stopCountdown();
    scrim.classList.add("open");
    renderAll();
  };

  const closeSettings = () => {
    scrim.classList.remove("open");
    if (state === "color") {
      // Opening settings stopped the timer; give the current color a fresh one.
      startCountdown(settings.colors[lastIndex]?.hex ?? "#000000");
    } else if (stage.style.backgroundColor !== hexToRgb(pauseHex())) {
      paint(pauseHex());
    }
    $("#gear").focus({ preventScroll: true });
  };

  $("#gear").addEventListener("click", openSettings);
  $("#close").addEventListener("click", closeSettings);
  scrim.addEventListener("click", (e) => { if (e.target === scrim) closeSettings(); });

  $("#add").addEventListener("click", () => {
    settings.colors.push({ hex: randomHex(), name: "" });
    save();
    renderColors();
    renderDots();
    colorsEl.lastElementChild.querySelector(".name-input").focus();
  });

  $("#no-repeat").addEventListener("change", (e) => { settings.noRepeat = e.target.checked; save(); });
  $("#show-name").addEventListener("change", (e) => { settings.showName = e.target.checked; save(); });
  $("#pause-on").addEventListener("change", (e) => { settings.pause.enabled = e.target.checked; save(); renderOptions(); });

  $("#pause-mode").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    settings.pause.mode = b.dataset.value;
    save();
    renderOptions();
  });

  const step = (d) => {
    settings.pause.seconds = Math.min(60, Math.max(1, settings.pause.seconds + d));
    save();
    renderOptions();
  };
  $("#sec-down").addEventListener("click", () => step(-1));
  $("#sec-up").addEventListener("click", () => step(1));

  $("#pause-color").addEventListener("input", (e) => {
    settings.pause.hex = e.target.value;
    $("#pause-swatch").style.setProperty("--c", settings.pause.hex);
    save();
  });

  $("#lang").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    settings.lang = b.dataset.value;
    save();
    renderAll();
  });

  $("#share").addEventListener("click", async () => {
    const url = shareUrl();
    const btn = $("#share");
    // Native share sheet on phones/tablets; clipboard elsewhere.
    if (navigator.share && matchMedia("(pointer: coarse)").matches) {
      try { await navigator.share({ title: document.title, url }); } catch {}
      return;
    }
    try {
      await navigator.clipboard.writeText(url);
      btn.textContent = t("copied");
      setTimeout(() => (btn.textContent = t("share")), 2000);
    } catch {
      prompt(t("copyThis"), url);
    }
  });

  $("#reset").addEventListener("click", () => {
    if (!confirm(t("confirmReset"))) return;
    settings = defaults();
    lastIndex = -1;
    save();
    renderAll();
  });

  // ---------- Boot ----------

  applyI18n();
  renderDots();
  stage.style.backgroundColor = pauseHex();
  document.body.classList.toggle("light", isLight(pauseHex()));
})();
</script>
</body>
</html>
